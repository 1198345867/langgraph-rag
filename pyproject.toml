[project]
name = "langgraph-rag-backend"
version = "0.1.0"
description = "LangGraph RAG service backed by Elasticsearch, MinerU, and AGICTO."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=24.1.0",
    "elasticsearch[async]>=8.17.0,<8.20.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "langgraph>=0.4.0",
    "pydantic-settings>=2.8.0",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["backend"]
testpaths = ["tests"]
