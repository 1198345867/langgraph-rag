name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: 静态检查与单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check backend tests scripts
      - run: uv run pytest -q

  eval-gate:
    name: 评测基线回归
    runs-on: ubuntu-latest
    env:
      # 换新的评测报告后，改这里即可让门禁校验新结果
      REPORT_PATH: rag_eval_report_98_citation_fix.json
    steps:
      - uses: actions/checkout@v4
      - name: 与基线对比
        run: python scripts/check_regression.py --report "$REPORT_PATH"
      - name: 导出 Bad Case
        run: python scripts/export_badcases.py --report "$REPORT_PATH" --output badcases.md
      - uses: actions/upload-artifact@v4
        with:
          name: badcases
          path: badcases.md
